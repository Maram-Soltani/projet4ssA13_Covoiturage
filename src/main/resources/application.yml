server:
  port: 8084
spring:
  application:
    name: message-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/message_db
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/,http://localhost:8762/eureka/
  instance:
    instance-id: ${spring.application.name}:${server.port}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,mappings,loggers
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
info:
  app:
    name: message-service
    description: Microservice Messagerie